do e=pad3(ri(1,999));while(e[0]===e[1]==(e[1]===e[2])||e[0]===e[2]||e.startsWith("00")||e.endsWith("00"));return e}function mirrorD(){let e,t;do e=ri(0,9),t=ri(0,9);while(e===t||e===0);return""+e+t+e}function sameL(){const e=rL();return[e,e+e]}function pairL(){let e,t;do e=rL(),t=rL();while(e===t);return[e,t+t]}function pickRegion(){const e=.12+.05*(S.up.moscow||0),t=Math.random();return t<e?pick(MSK):t<e+.06?pick(SPB):t<e+.14?pick(MO):pick(OTH)}const TPL=[{id:"common",t:0,w:1,mk:[2e3,9e3],k:.3,name:"Обычный номер",desc:"Случайная комбинация из окна выдачи. Таких номеров на дорогах миллионы — перекуп возьмёт его разве что за компанию.",real:"Госпошлина за новые номера в России выросла с 2 000 до 3 000 ₽ — ровно столько стоит одна выдача в окне МРЭО.",gen(){let e,t,n;do[e,t]=plainL(),n=plainD();while(e==="Т"&&n==="800");return{s:e,d:n,l:t}}},{id:"double",t:1,w:3,mk:[6e3,18e3],k:.5,name:"Дубль",desc:"Две одинаковые цифры рядом: 112, 557, 988. Почти красиво — продавцы называют такие номера «на подходе».",real:null,gen(){const[e,t]=plainL();return{s:e,d:doubleD(),l:t}}},{id:"mirror",t:1,w:4,mk:[8e3,25e3],k:.5,name:"Зеркалка",desc:"Цифры читаются одинаково слева направо и справа налево: 121, 474, 808. Самый доступный «красивый» номер — его берут для души, а не для понтов.",real:"В 2026 году среди объявлений дороже 2 млрд ₽ был и зеркальный А969АС: продавец сам назначает цену, и рынок это терпит.",gen(){const[e,t]=plainL();return{s:e,d:mirrorD(),l:t}}},{id:"ladder",t:1,w:2,mk:[12e3,4e4],k:.5,name:"Лесенка",desc:"Цифры идут подряд: 123, 456 или в обратную сторону — 987. Легко запомнить и легко продиктовать эвакуаторщику.",real:"Autonews в обзоре «серого» рынка выделял «лесенки» и «зеркалки» в отдельные категории со своими ценами.",gen(){const[e,t]=plainL();return{s:e,d:pick(LADDERS),l:t}}},{id:"round",t:1,w:2,mk:[1e4,3e4],k:.5,name:"Круглый",desc:"Сотни — 100, 300, 500. Аккуратно и солидно: такой номер одинаково уместен и на «Солярисе», и на «Крузаке».",real:null,gen(){const[e,t]=plainL();return{s:e,d:ri(1,9)+"00",l:t}}},{id:"word",t:1,w:3,mk:[1e4,45e3],k:.5,name:"Слово на номере",desc:"Первая буква и две последние складываются в слово: К…ОТ, С…ОК, Р…АК. Номер превращается в подпись машины.",real:"Буквы на российских номерах — только те 12, что совпадают по написанию с латиницей: А, В, Е, К, М, Н, О, Р, С, Т, У, Х. Поэтому слов так мало, и каждое на счету.",gen(){const e=pick(Object.keys(WORDS));return{s:e[0],d:plainD(),l:e.slice(1),w:e}}},{id:"triple",t:2,w:3,mk:[7e4,22e4],k:.5,name:"Три в ряд",desc:"Три одинаковые цифры — 111, 333, 888. Классический «красивый» номер: его видно издалека и легко узнать в потоке.",real:"Цифры — только половина цены. С парой одинаковых букв тот же номер стоит заметно дороже (см. «Полублат»).",gen(){const[e,t]=plainL(),n=pick([1,2,3,4,5,8,9]);return{s:e,d:""+n+n+n,l:t}}},{id:"zeros",t:2,w:2.5,mk:[6e4,2e5],k:.5,name:"Нолики",desc:"001–009 — первые номера серии. Принято считать, что их исторически получало начальство, поэтому нули ценятся особо.",real:"Е001КХ с регионом 70 в 2026 году предлагали за 3,1 млн ₽ — но там нули усилены блатной серией.",gen(){const[e,t]=plainL();return{s:e,d:"00"+pick([1,2,3,4,5,6,8,9]),l:t}}},{id:"agent",t:2,w:.6,mk:[15e4,4e5],k:.5,name:"Агент 007",desc:"Номер агента её величества. На «бондовский» номер всегда найдётся покупатель с чувством юмора и чёрным седаном.",real:"Анонимный продавец рассказывал Autonews, что номер с 007 долго лежал у них и стоил очень приличных денег.",gen(){const[e,t]=plainL();return{s:e,d:"007",l:t}}},{id:"beast",t:2,w:.8,mk:[12e4,3e5],k:.5,name:"Число зверя",desc:"666. Одни сплёвывают через плечо, другие доплачивают. Отличный номер для катафалка или метал-группы.",real:"В 2026 году Е666АК выставляли за 249 тыс. ₽, а А666МР 77 — уже за 17,5 млн. Решает не число, а серия.",gen(){const[e,t]=plainL();return{s:e,d:"666",l:t}}},{id:"echo",t:2,w:1.5,mk:[9e4,2e5],k:.4,name:"Эхо региона",desc:"Цифры совпадают с кодом региона: 199 … 199, 078 … 78. Перекупы называют такие номера «зеркалкой с регионом».",real:"В 2014 году московский продавец оценивал номер 199…199 примерно в 150 тыс. ₽.",gen(){let e;do e=pickRegion();while(e==="777");const[t,n]=plainL();return{s:t,d:pad3(e),l:n,r:e}}},{id:"loud",t:2,w:1.6,mk:[6e4,18e4],k:.5,name:"Громкое слово",desc:"Слово, которое прочитает каждый водитель в соседнем ряду. Такие номера покупают ради реакции окружающих.",real:null,gen(){const e=pick(Object.keys(LOUD));return{s:e[0],d:plainD(),l:e.slice(1),w:e}}},{id:"tripleL",t:3,w:3,mk:[2e5,7e5],k:.6,name:"Три буквы",desc:"Все три буквы одинаковые: А…АА, О…ОО, С…СС. Именно буквы — главный множитель цены, они и делают номер «блатным».",real:"Однажды ГИБДД Москвы публично отчиталась, кому достались номера серии ААА с регионом 777, — 64 из них ушли на автомобили Hyundai.",gen(){const[e,t]=sameL();return{s:e,d:plainD(),l:t}}},{id:"sevens",t:3,w:2,mk:[25e4,8e5],k:.6,name:"Три семёрки",desc:"777 — «три топора». Самая узнаваемая комбинация цифр на дорогах России и вечный хит перекупов.",real:"Ещё в 2014 году продавцы жаловались, что номера 777 с регионом 777 в дефиците: они почти сразу оказывались на машинах.",gen(){const[e,t]=plainL();return{s:e,d:"777",l:t}}},{id:"halfBlat",t:3,w:2.5,mk:[22e4,6e5],k:.6,name:"Полублат",desc:"Три одинаковые цифры и пара одинаковых букв на конце: Т111ВВ, К555ОО. Почти блат — выбивается только первая буква.",real:"В 2026 году за Т111ВВ в объявлении просили 249 тыс. ₽.",gen(){const[e,t]=pairL(),n=pick([1,2,3,4,5,6,8,9]);return{s:e,d:""+n+n+n,l:t}}},{id:"zeroPair",t:3,w:1.5,mk:[25e4,65e4],k:.6,name:"Нули с парой",desc:"00X и пара одинаковых букв на конце. Выглядит как номер служебной машины, хотя ею не является.",real:null,gen(){const[e,t]=pairL();return{s:e,d:"00"+ri(1,9),l:t}}},{id:"mirrorBlat",t:4,w:2.5,mk:[7e5,16e5],k:.6,name:"Блатная зеркалка",desc:"Три одинаковые буквы и зеркальные цифры: М414ММ, О525ОО. Красиво с любой стороны — даже в зеркале заднего вида.",real:"За М414ММ в 2026 году просили 1 млн ₽.",gen(){const[e,t]=sameL();return{s:e,d:mirrorD(),l:t}}},{id:"ott",t:4,w:1.5,mk:[1e6,3e6],k:.4,name:"Серия ОТТ",desc:"По распространённой версии, эту серию долго закрепляли за ГИБДД и не выдавали обычным гражданам. Говорят, инспекторы до сих пор провожают такие машины взглядом.",real:"В 2026 году СМИ упоминали ОТТ среди серий, которые ценятся наравне с «блатными» АМР и ЕКХ.",gen(){return{s:"О",d:plainD(),l:"ТТ"}}},{id:"mmr",t:4,w:1.2,mk:[12e5,35e5],k:.4,name:"Серия ММР",desc:"Одна из «говорящих» серий, которые перечисляют рядом с ААА и ООО. Происхождение туманное, но владельцы относятся к ней с большим уважением.",real:"«360» в материале о культуре понта называл ММР среди сочетаний, которые многое говорят об автомобиле и его водителе.",gen(){return{s:"М",d:plainD(),l:"МР"}}},{id:"mrFamily",t:4,w:2,mk:[15e5,5e6],k:.4,name:"Родня АМР",desc:"Буквы МР на конце, но первая — не та. Издалека их легко спутать с легендарной АМР, чем владельцы с удовольствием пользуются.",real:"О333МР в 2026 году выставляли за 4,8 млн ₽.",gen(){return{s:pick("ВЕКНОРСТУХ"),d:Math.random()<.4?pick(["111","222","333","555","888","999"]):plainD(),l:"МР"}}},{id:"tripleBlat",t:4,w:1.5,mk:[18e5,5e6],k:.3,name:"Фуллблат в регионе",desc:"Одинаковые буквы и одинаковые цифры — В555ВВ, Е888ЕЕ. Полный блат, просто не московский. В своём городе это номер-легенда.",real:"В 2026 году на продаже висели 16 номеров дороже 2 млрд ₽, в основном именно с тремя одинаковыми буквами и цифрами — в том числе из Адыгеи, Красноярского края и Дагестана.",gen(){const[e,t]=sameL(),n=pick([1,2,3,4,5,6,8,9]);return{s:e,d:""+n+n+n,l:t,r:pick(OTH.concat(SPB,MO))}}},{id:"zeroBlat",t:4,w:1.2,mk:[2e6,6e6],k:.3,name:"Первая десятка",desc:"Одинаковые буквы и номер от 001 до 009. Выглядит так, будто его вручали лично, с рукопожатием.",real:null,gen(){const[e,t]=sameL();return{s:e,d:"00"+ri(1,9),l:t,r:pick(OTH.concat(SPB,MO))}}},{id:"ekhFam",t:4,w:1.5,mk:[1e6,35e5],k:.4,name:"Родня ЕКХ",desc:"Буквы КХ на конце — издалека похоже на ЕКХ. Инспек
